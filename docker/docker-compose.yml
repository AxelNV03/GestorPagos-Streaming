services:
  db:
    image: mariadb:12.2.2
    container_name: pagos_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: streaming
      MARIADB_USER: nava
      MARIADB_PASSWORD: 1234
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pagos_app
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ..:/app:Z
      - ../storage:/app/storage:Z
      # Los .pem solo se usan si quieres SSL directo en Flask (no necesario con Cloudflare Tunnel).
      # Si los tienes, descomenta apuntando a archivos reales:
      - ../fullchain.pem:/app/fullchain.pem:ro
      - ../privkey.pem:/app/privkey.pem:ro
    ports:
      - "5000:5000"
    env_file: ../.env
    environment:
      - TZ=America/Mexico_City
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
